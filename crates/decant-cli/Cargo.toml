[package]
name = "decant-cli"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "decant"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4.6.5"
comfy-table = "7.2.2"
decant-core = { path = "../decant-core" }
decant-daemon = { path = "../decant-daemon" }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1", features = ["rt-multi-thread"] }

# Unix-only: PID-alive checks (`kill(pid, 0)`) and SIGTERM for daemon lifecycle.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
