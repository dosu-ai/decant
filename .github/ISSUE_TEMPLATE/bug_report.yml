name: Bug report
description: decant behaves differently from what it documents.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        # Do not paste real session transcripts

        **This issue is public.** Your Claude Code, Codex, Gemini CLI, OpenCode,
        Cursor CLI, GitHub Copilot CLI, Copilot Chat in VS Code, and Hermes Agent
        sessions, and the ATIF trajectories you import, contain your own source code, file paths, prompts, and
        everything else you typed into those tools. decant keeps them on your
        machine. Pasting one here would not.

        Reproduce the bug with a **synthetic** session file instead. Hand-write a small
        file that triggers the same failure and ingest it into a scratch archive:

        ```
        decant --no-sync --db /tmp/decant-repro.db sync --path ./repro.jsonl
        decant --no-sync --db /tmp/decant-repro.db ls
        ```

        For a Copilot CLI reproduction, keep its journal at
        `./session-state/example/events.jsonl` and pass that path instead of
        `./repro.jsonl`. A custom session root also works when passed with
        `--copilot-dir`, such as `--copilot-dir ./copilot --path ./copilot/example/events.jsonl`.

        The `fixtures/` directory in this repository shows the shape of each source
        format. If you cannot reproduce it synthetically, describe the *structure* of
        the input that breaks (message kinds, field names, sizes, encodings) without
        the content. Redact paths, code, and prompts from any output you paste,
        including error messages and logs.

  - type: checkboxes
    id: privacy
    attributes:
      label: Transcript privacy
      options:
        - label: This report contains no real transcript content, meaning no source code, file paths, or prompts from my own sessions.
          required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The actual behavior, including the exact command you ran and any error output.
      placeholder: |
        $ decant search "auth bug"
        error: ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What should have happened instead, and where that behavior is documented if it is.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Numbered steps starting from a clean archive. Inline the synthetic session file if the bug depends on input shape.
      placeholder: |
        1. Write ./repro.jsonl containing ...
        2. decant --no-sync --db /tmp/decant-repro.db sync --path ./repro.jsonl
        3. decant --no-sync --db /tmp/decant-repro.db ls
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: decant doctor output
      description: |
        Paste the output of `decant doctor`. It reports the version, install method,
        platform, schema versions, what discovery finds for each source, and how many sessions the archive holds.
        It prints no transcript content and hides paths outside your home directory.
        On releases before `doctor` existed, paste `decant --version` and the
        `schema:` line from `decant db info` instead.
      render: text
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: Install method
      options:
        - npx / npm
        - Homebrew
        - install.sh
        - Docker
        - Built from source
    validations:
      required: true

  - type: dropdown
    id: source-tool
    attributes:
      label: Source tool
      description: Which tools wrote the sessions involved.
      multiple: true
      options:
        - Claude Code
        - Codex
        - Gemini CLI
        - OpenCode
        - Cursor CLI
        - GitHub Copilot CLI
        - Copilot Chat in VS Code
        - ATIF trajectories
        - Hermes Agent
        - Not applicable
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Where you saw the problem.
      options:
        - Sync and parsing
        - CLI output
        - Web UI
        - Local API
        - Costs and pricing
        - Install, update, or packaging
        - Not sure
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Non-default settings, or operational logs from `DECANT_LOG_LEVEL=debug`. Redact before pasting.
