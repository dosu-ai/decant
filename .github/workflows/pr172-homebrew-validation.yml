name: PR 172 Homebrew validation

on:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/workflows/pr172-homebrew-validation.yml

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  homebrew:
    name: Homebrew setup, audit, install, test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-15
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      VERSION: "0.9.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun
        with:
          install: "false"

      - name: Confirm the tested action matches the release workflow
        run: |
          grep -F 'uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478' .github/workflows/release.yml

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1

      - name: Render formula from existing published release checksums
        run: |
          set -euo pipefail
          mkdir -p dist/release
          curl -fsSL --retry 3 "https://github.com/dosu-ai/decant/releases/download/v${VERSION}/SHA256SUMS" -o dist/release/SHA256SUMS
          bun run scripts/release/render-homebrew-formula.ts

      - name: Tap and stage the rendered formula
        run: |
          set -euo pipefail
          brew tap dosu-ai/dosu
          cp dist/homebrew/decant.rb "$(brew --repository dosu-ai/dosu)/Formula/decant.rb"

      - name: Audit the formula
        run: brew audit --strict --online --formula dosu-ai/dosu/decant

      - name: Install the formula
        run: brew install --formula dosu-ai/dosu/decant

      - name: Run the formula test block
        run: brew test dosu-ai/dosu/decant

      - name: Check installed version and CLI
        run: |
          set -euo pipefail
          out="$(decant --version)"
          echo "Homebrew decant reports: $out"
          [[ "$out" == *"$VERSION"* ]]
          decant --help
