# Pre-commit hooks for decant. CI remains the source of truth.
minimum_pre_commit_version: "3.5.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=512"]

  - repo: local
    hooks:
      - id: biome-check
        name: biome check
        entry: bunx biome check .
        language: system
        files: '^(src|test|scripts|npm)/.*\.(ts|tsx|cjs|json|html|css)$|^[^/]+\.json$'
        pass_filenames: false

      - id: ts-typecheck
        name: TypeScript typecheck
        entry: bunx tsc --noEmit
        language: system
        files: '^(src|test|scripts)/.*\.ts$|^(package\.json|tsconfig\.json)$'
        pass_filenames: false

      - id: ts-test
        name: TypeScript tests
        entry: bun test
        language: system
        files: '^(src|test|fixtures)/.*|^(package\.json|bun\.lock)$'
        pass_filenames: false
