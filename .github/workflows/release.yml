
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (must match an existing v* tag that peels to the run's commit)"
        required: true
        type: string

permissions: {}

concurrency: release-${{ github.ref_name }}

defaults:
  run:
    shell: bash

jobs:
  meta:
    name: Release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      is_prerelease: ${{ steps.v.outputs.is_prerelease }}
      is_latest: ${{ steps.v.outputs.is_latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun
        with:
          install: "false"

      - name: Validate VERSION and guard the tag
        id: v
        env:
          RAW: ${{ inputs.version || github.ref_name }}
        run: bun run scripts/release/meta.ts

  verify:
    name: Verify (biome, tsc, test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      - name: Lint and format (Biome)
        run: bunx biome ci .

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Test
        run: bun test

  build:
    name: Build, sign, and package binaries
    needs: [meta, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      signed: ${{ steps.signing-mode.outputs.signed }}
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      - name: Build all release targets
        run: bun run scripts/build-binaries.ts --target all --out-dir dist/bin --version "$VERSION"

      - name: Record pre-signing SHA256s
        run: sha256sum dist/bin/*/decant | tee presign-sha256s.txt

      - name: Install rcodesign (pinned)
        run: bun run scripts/release/install-rcodesign.ts

      - name: Determine signing mode
        id: signing-mode
        env:
          MACOS_CERT_P12_B64: ${{ secrets.MACOS_CERT_P12_B64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: bun run scripts/release/signing-mode.ts

      - name: Sign and notarize darwin binaries (Developer ID)
        if: steps.signing-mode.outputs.signed == 'true'
        env:
          SIGN_MODE: developer-id
          MACOS_CERT_P12_B64: ${{ secrets.MACOS_CERT_P12_B64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: bun run scripts/release/sign-darwin.ts

      - name: Ad-hoc sign darwin binaries (no Developer ID secrets)
        if: steps.signing-mode.outputs.signed != 'true'
        env:
          SIGN_MODE: ad-hoc
        run: bun run scripts/release/sign-darwin.ts

      - name: Package deterministic release tarballs
        run: bun run scripts/release/package-release.ts

      - name: Attest build provenance (tarballs, raw binaries, SHA256SUMS)
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/release/decant-*.tar.gz
            dist/bin/*/decant
            dist/release/SHA256SUMS

      - name: Stage attestation bundle as a release asset
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          [ -s "$BUNDLE_PATH" ] || { echo "::error::actions/attest reported no bundle at '${BUNDLE_PATH}'"; exit 1; }
          cp "$BUNDLE_PATH" "dist/release/decant-${VERSION}.sigstore.json"

      - name: Upload pre-signing hashes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: presign-sha256s
          path: presign-sha256s.txt
          if-no-files-found: error

      - name: Upload release tarballs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-tarballs
          path: dist/release/
          if-no-files-found: error

      - name: Upload signed binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-binaries
          path: dist/bin/
          if-no-files-found: error

  smoke-darwin:
    name: Smoke signed darwin binary (${{ matrix.target }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SIGNED: ${{ needs.build.outputs.signed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun
        with:
          install: "false"

      - name: Download release tarballs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-tarballs
          path: dist/release

      - name: Extract, run, and verify the darwin binary
        env:
          TARGET: ${{ matrix.target }}
        run: bun run scripts/release/smoke-darwin.ts

  determinism:
    name: Determinism canary (non-blocking)
    needs: [meta, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      - name: Rebuild all release targets
        run: bun run scripts/build-binaries.ts --target all --out-dir dist/bin --version "$VERSION"

      - name: Download pre-signing hashes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: presign-sha256s

      - name: Hash the rebuilt binaries
        run: sha256sum dist/bin/*/decant | tee rebuild-sha256s.txt

      - name: Compare rebuild against pre-signing hashes (WARN only)
        run: |
          if diff -u presign-sha256s.txt rebuild-sha256s.txt; then
            echo "determinism canary: rebuild is byte-identical to the release build"
          else
            echo "::warning::determinism canary: rebuild diverged from the release build's pre-signing hashes (non-blocking)"
          fi

  npm:
    name: Publish npm packages
    needs: [meta, build, smoke-darwin]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      - name: Download signed binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-binaries
          path: dist/bin

      - name: Stage npm packages from signed binaries
        run: bun run scripts/build-npm.ts --target all --binary-dir dist/bin --out-dir dist/npm --no-build --clean --version "$VERSION"

      - name: Assert LICENSE and NOTICE staged in all five packages
        run: bun run scripts/release/assert-npm-packages.ts

      - name: Set up Node for npm publish
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Assert npm supports trusted publishing (>= 11.5.1)
        run: dpkg --compare-versions "$(npm --version)" ge 11.5.1 || exit 1

      - name: Pack-and-install smoke on staged packages (pre-publish)
        run: bun run scripts/release/smoke-npm-staged.ts

      - name: Publish packages (OIDC trusted publishing)
        env:
          IS_PRERELEASE: ${{ needs.meta.outputs.is_prerelease }}
          IS_LATEST: ${{ needs.meta.outputs.is_latest }}
        run: bun run scripts/release/publish-npm.ts

  npm-smoke:
    name: Post-publish npx smoke (${{ matrix.target }})
    needs: [meta, npm]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-15
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun
        with:
          install: "false"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Run the launcher like an npx user (retry for registry propagation)
        run: bun run scripts/release/npx-smoke.ts

  github-release:
    name: GitHub Release
    needs: [meta, build, npm, npm-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun
        with:
          install: "false"

      - name: Download release tarballs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-tarballs
          path: dist/release

      - name: Stage install.sh next to the tarballs
        run: cp install.sh dist/release/install.sh

      - name: Publish or refresh the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.meta.outputs.version }}
          RELEASE_DIR: dist/release
          IS_PRERELEASE: ${{ needs.meta.outputs.is_prerelease }}
          IS_LATEST: ${{ needs.meta.outputs.is_latest }}
        run: bun run scripts/release/publish-github-release.ts

  docker:
    name: Publish Docker image
    needs: [meta, build, smoke-darwin]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun
        with:
          install: "false"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: image
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/dosu-ai/decant
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.meta.outputs.version }}
            type=raw,value=latest,enable=${{ needs.meta.outputs.is_latest == 'true' }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          build-args: |
            DECANT_VERSION=${{ needs.meta.outputs.version }}
          provenance: mode=max
          sbom: true

      - name: Attest image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/dosu-ai/decant
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Check the image is anonymously pullable
        continue-on-error: true
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: bun run scripts/release/check-ghcr-public.ts

  homebrew-formula:
    name: Render Homebrew formula
    needs: [meta, build, github-release]
    if: needs.meta.outputs.is_prerelease == 'false' && needs.meta.outputs.is_latest == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun
        with:
          install: "false"

      - name: Download release tarballs (for SHA256SUMS)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-tarballs
          path: dist/release

      - name: Render decant.rb from the in-repo template
        run: bun run scripts/release/render-homebrew-formula.ts

      - name: Upload rendered formula
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homebrew-formula
          path: dist/homebrew/decant.rb
          if-no-files-found: error

  homebrew-smoke:
    name: Homebrew install smoke (${{ matrix.target }})
    needs: [meta, homebrew-formula]
    if: needs.meta.outputs.is_prerelease == 'false' && needs.meta.outputs.is_latest == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-15
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1

      - name: Download rendered formula
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: homebrew-formula
          path: Formula

      - name: Tap dosu-ai/dosu
        run: brew tap dosu-ai/dosu

      - name: Put the rendered formula in the tap
        run: cp Formula/decant.rb "$(brew --repository dosu-ai/dosu)/Formula/decant.rb"

      - name: Audit the formula
        run: brew audit --strict --online --formula dosu-ai/dosu/decant

      - name: Install the formula
        run: brew install --formula dosu-ai/dosu/decant

      - name: Run the formula test block
        run: brew test dosu-ai/dosu/decant

      - name: Check the installed version
        run: |
          out="$(decant --version)"
          echo "Homebrew decant reports: $out"
          [[ "$out" == *"$VERSION"* ]] || { echo "::error::Homebrew decant reported '$out', expected version $VERSION"; exit 1; }

  tap-update:
    name: Update Homebrew tap
    needs: [meta, github-release, homebrew-formula, homebrew-smoke]
    if: needs.meta.outputs.is_prerelease == 'false' && needs.meta.outputs.is_latest == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - name: Check out dosu-ai/homebrew-dosu # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dosu-ai/homebrew-dosu
          token: ${{ secrets.HOMEBREW_TOKEN }}
          path: homebrew-dosu

      - name: Download tested formula
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: homebrew-formula
          path: homebrew-dosu/Formula

      - name: Commit and push
        working-directory: homebrew-dosu
        run: |
          git add Formula/decant.rb
          if git diff --cached --quiet; then echo "::notice::Formula/decant.rb already matches v${VERSION} — nothing to push"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Update decant to v${VERSION}"
          git push
