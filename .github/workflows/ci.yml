name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript (biome, tsc, test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint and format (Biome)
        run: bunx biome ci .

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Test
        run: bun test

      - name: Build release binary matrix
        run: bun run scripts/build-binaries.ts --target all --out-dir /tmp/decant-bin --version 0.0.0-ci

      - name: Stage npm package matrix
        run: bun run scripts/build-npm.ts --target all --binary-dir /tmp/decant-bin --out-dir /tmp/decant-npm --no-build --clean --version 0.0.0-ci

  docker:
    name: Docker (multi-arch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # .bun-version is the single source of truth for the Bun toolchain (plan §3
      # 0.5). Dependabot bumps the Dockerfile's builder tag weekly, so drift is
      # otherwise guaranteed — this guard turns silent drift into a red check so
      # the pin is only ever moved deliberately (via .bun-version).
      - name: Assert Dockerfile builder matches .bun-version
        run: |
          set -euo pipefail
          bun_version="$(cat .bun-version)"
          escaped="${bun_version//./\\.}"
          if ! grep -Eq "^FROM oven/bun:${escaped}-slim(@sha256:[0-9a-f]{64})? AS build$" Dockerfile; then
            echo "::error file=Dockerfile::builder image must be oven/bun:${bun_version}-slim to match .bun-version — bump .bun-version deliberately or revert the Dockerfile tag"
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build local amd64 image
        run: docker build --platform linux/amd64 -t decant:ci .

      - name: Smoke CLI
        run: docker run --rm decant:ci --help

      # Curl an /api/* route from the host through a published port: the request
      # reaches the container from the Docker bridge gateway, exercising the
      # image's DECANT_TRUSTED_PEERS default end-to-end exactly like the
      # documented `docker run` deployment (plan §3 0.1).
      - name: Smoke /api/* through the bridge (DECANT_TRUSTED_PEERS)
        run: |
          set -euo pipefail
          docker run -d --name decant-smoke -p 127.0.0.1:3000:3000 decant:ci
          reachable=""
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1; then
              reachable=1
              break
            fi
            sleep 1
          done
          if [ -z "$reachable" ]; then
            echo "::error::/api/health never answered 200 through the published port — DECANT_TRUSTED_PEERS wiring is broken"
            docker logs decant-smoke || true
            docker rm -f decant-smoke
            exit 1
          fi
          curl -fsS http://127.0.0.1:3000/api/health
          echo
          docker rm -f decant-smoke

      - name: Validate multi-arch Docker build
        run: docker buildx build --platform linux/amd64,linux/arm64 --output=type=cacheonly .
