name: PR labels

# Applies size:* and area:* labels from the changed-file list. Fork pull
# requests need pull_request_target for a token that can write labels. The job
# checks out the base branch only (the default for this trigger) to load
# .github/scripts/pr-labels.cjs, and never runs code from the pull request.
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  label:
    name: Label pull request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/pr-labels.cjs
          sparse-checkout-cone-mode: false

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { AREA_COLOR, SIZE_LABELS, areaLabels, sizeLabel } = require(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/pr-labels.cjs`,
            );
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: issue_number,
              per_page: 100,
            });

            async function ensureLabel(name, color, description) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner, repo, name, color, description });
              }
            }

            const size = sizeLabel(files);
            const areas = areaLabels(files);
            await ensureLabel(size.name, size.color, size.description);
            for (const area of areas) {
              await ensureLabel(area.name, AREA_COLOR, area.description);
            }

            // Size is replaced on every push. Area labels only accumulate, so a
            // label a maintainer added by hand is never removed.
            const current = context.payload.pull_request.labels.map((label) => label.name);
            for (const stale of current) {
              if (stale !== size.name && SIZE_LABELS.some((label) => label.name === stale)) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name: stale });
              }
            }
            const add = [size.name, ...areas.map((area) => area.name)].filter(
              (name) => !current.includes(name),
            );
            if (add.length > 0) {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: add });
            }
            core.info(`size ${size.name}; areas ${areas.map((area) => area.name).join(", ") || "none"}`);
