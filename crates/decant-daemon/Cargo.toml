[package]
name = "decant-daemon"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "decant-daemon"
path = "src/main.rs"

[dependencies]
anyhow = "1"
decant-core = { path = "../decant-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync"] }
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
hex = "0.4"
base64 = "0.22"
fs2 = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Data path (Plan 2): private SQLite owned by the daemon.
# rusqlite is pinned to match decant-core's version so the bundled
# libsqlite3-sys (links = "sqlite3") resolves to a single copy. We build the
# r2d2 read pool with a hand-written ManageConnection over decant-core's
# db::open rather than r2d2_sqlite, because no published r2d2_sqlite targets
# rusqlite 0.40 yet (latest targets 0.39) and r2d2_sqlite would drag in a
# conflicting libsqlite3-sys.
rusqlite = { version = "0.40.1", features = ["bundled"] }
r2d2 = "0.8"
notify = "6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Adapts the change-event `broadcast::Receiver` into a `Stream` for the SSE
# endpoint (`BroadcastStream`); `Lagged`/`Closed` surface as stream items we
# handle explicitly. The `sync` feature gates the broadcast wrapper.
tokio-stream = { version = "0.1", features = ["sync"] }

[dev-dependencies]
reqwest = { version = "0.13", features = ["json", "stream"] }
tempfile = "3"
futures-util = "0.3"
