# Tag-driven release pipeline (runbook: docs/releasing.md).
#
# Publishes, for every v* tag: five npm packages (OIDC trusted publishing with
# Sigstore provenance), a GitHub Release carrying deterministic tarballs +
# SHA256SUMS + install.sh, a multi-arch GHCR image with SBOM + provenance, and
# — for stable is_latest releases only — the Homebrew tap formula.
# When the Apple secrets below are configured, the two darwin binaries are
# Developer ID-signed and notarized (rcodesign, Linux-native) inside `build`,
# before anything publishes; without them the build ad-hoc signs instead
# (docs/releasing.md#macos-signing-and-notarization).
#
# Secrets contract:
#   MACOS_CERT_P12_B64   base64-encoded Developer ID Application certificate (.p12).
#   MACOS_CERT_PASSWORD  password for the .p12.
#   ASC_ISSUER_ID        App Store Connect API key issuer ID (notarization).
#   ASC_KEY_ID           App Store Connect API key ID (notarization).
#   ASC_KEY_P8           App Store Connect API private key contents (.p8, notarization).
#     All five or none: `build` Developer ID-signs and notarizes only when every one
#     is present, and otherwise falls back to ad-hoc signing with a loud warning.
#     Signing runs only on tag pushes and the guarded dispatch fallback — this
#     workflow has no PR trigger. See
#     docs/releasing.md#macos-signing-and-notarization.
#   HOMEBREW_TOKEN       PAT with push access to dosu-ai/homebrew-dosu (tap-update).
#
# npm needs no secret: publishing is OIDC trusted publishing, configured on all
# five packages (docs/releasing.md#npm-bootstrap-and-trusted-publishing).
#
# Re-run safety: every publish job is idempotent — npm skips versions
# that already exist, github-release refreshes assets instead of 422ing, Docker
# tags overwrite, and is_latest is recomputed from live origin tag state on every
# run so :latest / the `latest` dist-tag / the tap can never regress. To re-run
# manually, dispatch WITH THE TAG AS THE RUN REF:
#   gh workflow run release.yml --ref vX.Y.Z -f version=X.Y.Z

name: release

on:
  push:
    tags: ["v*"]
  # Manual fallback / re-runs — gated by meta's tag guard
  # (docs/releasing.md#tag-guard-and-prerelease-detection).
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (must match an existing v* tag that peels to the run's commit)"
        required: true
        type: string

permissions: {} # default-deny; grant per job

concurrency: release-${{ github.ref_name }}

jobs:
  meta:
    name: Release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # workflow-level is {}; checkout + ls-remote need read
    outputs:
      version: ${{ steps.v.outputs.version }}
      is_prerelease: ${{ steps.v.outputs.is_prerelease }}
      is_latest: ${{ steps.v.outputs.is_latest }}
    steps:
      # Default shallow checkout is fine — tag data comes from a targeted fetch +
      # ls-remote, never the local clone.
      # zizmor: ignore[artipacked] — the tag guard below runs `git fetch origin`,
      # which needs the credentials checkout persists. This job uploads no
      # artifacts, so there is nothing for them to leak into.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]

      - name: Derive, validate, and guard VERSION
        id: v
        env:
          RAW: ${{ inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${RAW#v}"; TAG="v$VERSION"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] \
            || { echo "::error::'$VERSION' is not semver"; exit 1; }

          # Dispatch guard: the tag must exist on origin AND peel to the commit this run builds.
          # Default checkout is shallow with fetch-tags:false, and on tag runs it rewrites the
          # annotated tag object locally (actions/checkout#290) — always re-fetch, forced.
          git fetch --no-tags --force origin "refs/tags/$TAG:refs/tags/$TAG" \
            || { echo "::error::tag $TAG not found on origin — push the tag before releasing"; exit 1; }
          TAG_COMMIT="$(git rev-parse "refs/tags/$TAG^{commit}")"   # ^{commit} peels annotated tags
          [ "$TAG_COMMIT" = "$GITHUB_SHA" ] \
            || { echo "::error::tag $TAG points at $TAG_COMMIT but this run builds $GITHUB_SHA — dispatch with the tag as the run ref"; exit 1; }

          if [[ "$VERSION" == *-* ]]; then IS_PRERELEASE=true; else IS_PRERELEASE=false; fi

          # is_latest: is VERSION the highest stable vX.Y.Z on origin right now? (Pure function of
          # live tag state — a v0.1.0 rerun after v0.2.0 exists computes false, by construction.)
          # sed strips the peeled ^{} refs ls-remote emits for annotated signed tags; sort -V on a
          # pre-filtered stable-only list avoids git's versionsort.suffix prerelease-ordering trap.
          IS_LATEST=false
          if [[ "$IS_PRERELEASE" == false ]]; then
            # Fetch as a standalone guarded assignment FIRST: a plain assignment from a single
            # command substitution propagates its exit status, so a transient ls-remote failure
            # kills the job here instead of silently yielding HIGHEST=$VERSION. is_latest must
            # fail CLOSED — failing open re-creates the exact :latest/dist-tag/tap regression
            # this gate exists to prevent. (Empty tag list on the first release is fine: the
            # union with $VERSION below makes v0.1.0 correctly compute is_latest=true.)
            TAGS="$(git ls-remote --tags origin 'v*')"
            HIGHEST=$(
              { printf '%s\n' "$TAGS" \
                  | awk '{print $2}' | sed -e 's#^refs/tags/##' -e 's/\^{}$//' \
                  | sort -u | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//'
                echo "$VERSION"
              } | sort -V | tail -n1)
            [[ "$HIGHEST" == "$VERSION" ]] && IS_LATEST=true
          fi

          { echo "version=$VERSION"
            echo "is_prerelease=$IS_PRERELEASE"
            echo "is_latest=$IS_LATEST"
          } >> "$GITHUB_OUTPUT"

  verify:
    name: Verify (biome, tsc, test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes; don't leave the token in .git/config.
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
          # No cache on the release path. A cache entry written by an earlier
          # PR run is attacker-influenced input, and this workflow signs and
          # publishes what it builds — a poisoned restore would ship.
          no-cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint and format (Biome)
        run: bunx biome ci .

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Test
        run: bun test

  build:
    name: Build, sign, and package binaries
    needs: [meta, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write # Sigstore signing for actions/attest
      attestations: write # persist the attestations
      artifact-metadata: write # artifact storage record (required by actions/attest v4)
    outputs:
      # 'true' only when the darwin binaries are Developer ID-signed AND notarized;
      # smoke-darwin reads this to decide whether the Gatekeeper gate applies.
      signed: ${{ steps.signing-mode.outputs.signed }}
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes; don't leave the token in .git/config.
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
          # No cache on the release path. A cache entry written by an earlier
          # PR run is attacker-influenced input, and this workflow signs and
          # publishes what it builds — a poisoned restore would ship.
          no-cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build all release targets
        run: bun run scripts/build-binaries.ts --target all --out-dir dist/bin --version "$VERSION"

      # The determinism canary diffs against THESE hashes — Developer ID signatures
      # embed a secure timestamp and would always diverge post-signing
      # (docs/releasing.md#determinism-canary).
      - name: Record pre-signing SHA256s
        run: sha256sum dist/bin/*/decant | tee presign-sha256s.txt

      - name: Install rcodesign (pinned)
        run: |
          set -euo pipefail
          # Pinned release of apple-codesign (indygreg/apple-platform-rs); checksum is
          # the published .tar.gz.sha256 asset for this exact version. Never "latest".
          RCODESIGN_VERSION="0.29.0"
          RCODESIGN_SHA256="dbe85cedd8ee4217b64e9a0e4c2aef92ab8bcaaa41f20bde99781ff02e600002"
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o rcodesign.tar.gz \
            "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F${RCODESIGN_VERSION}/apple-codesign-${RCODESIGN_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${RCODESIGN_SHA256}  rcodesign.tar.gz" | sha256sum -c -
          tar -xzf rcodesign.tar.gz --strip-components=1 \
            "apple-codesign-${RCODESIGN_VERSION}-x86_64-unknown-linux-musl/rcodesign"
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 755 rcodesign "$RUNNER_TEMP/bin/rcodesign"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Developer ID signing needs all five Apple secrets. Until Apple Developer
      # enrollment lands they are absent, so the release ad-hoc signs instead of
      # failing — see docs/releasing.md#macos-signing-and-notarization. This step
      # owns the presence check for both signing steps below; it tests emptiness
      # only and never echoes a secret value.
      - name: Determine signing mode
        id: signing-mode
        env:
          MACOS_CERT_P12_B64: ${{ secrets.MACOS_CERT_P12_B64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          missing=0
          for secret_name in MACOS_CERT_P12_B64 MACOS_CERT_PASSWORD ASC_ISSUER_ID ASC_KEY_ID ASC_KEY_P8; do
            if [ -z "${!secret_name}" ]; then
              echo "::warning::secret ${secret_name} is not configured"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "signing mode: Developer ID (sign + notarize)"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::${missing} of 5 Apple signing secrets are missing — falling back to AD-HOC signing. The darwin binaries will NOT be Developer ID-signed or notarized, and macOS users will get a Gatekeeper prompt on first run that they must clear by hand. Configure all five secrets to publish notarized builds: docs/releasing.md#macos-signing-and-notarization"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      # Runs only when every Apple secret is present. Signing happens only on tag
      # builds by construction — this workflow has no PR trigger. A failure here
      # (bad certificate, notary rejection) fails the release before anything
      # publishes: docs/releasing.md#macos-signing-and-notarization.
      - name: Sign and notarize darwin binaries (Developer ID)
        if: steps.signing-mode.outputs.signed == 'true'
        env:
          MACOS_CERT_P12_B64: ${{ secrets.MACOS_CERT_P12_B64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          # Key material: 0600 files in a private temp dir, never echoed.
          umask 077
          keys_dir="$(mktemp -d "${RUNNER_TEMP}/sign.XXXXXX")"
          printf '%s' "$MACOS_CERT_P12_B64" | base64 -d > "${keys_dir}/cert.p12"
          printf '%s' "$MACOS_CERT_PASSWORD" > "${keys_dir}/p12-password"
          printf '%s' "$ASC_KEY_P8" > "${keys_dir}/asc-key.p8"
          # Unified App Store Connect API key JSON in the exact format rcodesign
          # documents for --api-key-file, built in-job from the three secrets.
          rcodesign encode-app-store-connect-api-key -o "${keys_dir}/asc-api-key.json" \
            "$ASC_ISSUER_ID" "$ASC_KEY_ID" "${keys_dir}/asc-key.p8"

          for target in darwin-arm64 darwin-x64; do
            # --for-notarization enforces hardened runtime + secure timestamp;
            # entitlements.plist carries Bun's documented JIT entitlements
            # (docs/releasing.md#macos-signing-and-notarization).
            rcodesign sign \
              --p12-file "${keys_dir}/cert.p12" \
              --p12-password-file "${keys_dir}/p12-password" \
              --for-notarization \
              -e entitlements.plist \
              "dist/bin/${target}/decant"

            # Notarize a temporary .zip: the Notary API rejects .tar.gz, and a
            # bare Mach-O binary cannot be stapled, so the ticket stays with
            # Apple rather than in the file
            # (docs/releasing.md#macos-signing-and-notarization). Retry transient
            # notary failures; a real rejection fails the release here, before
            # anything publishes.
            zip -j -q "${keys_dir}/decant-${target}.zip" "dist/bin/${target}/decant"
            submitted=false
            for attempt in 1 2 3; do
              if rcodesign notary-submit --api-key-file "${keys_dir}/asc-api-key.json" \
                  --wait "${keys_dir}/decant-${target}.zip"; then
                submitted=true
                break
              fi
              echo "::warning::notary-submit attempt ${attempt} failed for ${target} — retrying"
              sleep 30
            done
            if [ "$submitted" != "true" ]; then
              echo "::error::notarization failed for ${target} after 3 attempts"
              exit 1
            fi
          done

          rm -rf "${keys_dir}"

      # Fallback when the Apple secrets are absent. Ad-hoc signing is NOT a
      # substitute for Developer ID + notarization, but it is not optional either:
      # an unsigned Mach-O behaves worse than an ad-hoc signed one (arm64 macOS
      # refuses to execute unsigned binaries outright), so sign either way.
      - name: Ad-hoc sign darwin binaries (no Developer ID secrets)
        if: steps.signing-mode.outputs.signed != 'true'
        run: |
          set -euo pipefail
          for target in darwin-arm64 darwin-x64; do
            rcodesign sign "dist/bin/${target}/decant"
          done
          echo "::warning::darwin binaries are AD-HOC signed — not Developer ID-signed and not notarized. macOS users will see a Gatekeeper prompt on first run: docs/releasing.md#macos-signing-and-notarization"

      - name: Package deterministic release tarballs
        run: |
          set -euo pipefail
          mkdir -p dist/release
          # Deterministic archives: fixed member order/ownership, mtimes pinned to
          # the tag commit time, and gzip without the embedded timestamp
          # (docs/releasing.md#deterministic-tarballs).
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            cp LICENSE NOTICE "dist/bin/${target}/"
            tar --sort=name --owner=0 --group=0 --numeric-owner \
              --mtime="@${SOURCE_DATE_EPOCH}" \
              -C "dist/bin/${target}" -cf - decant LICENSE NOTICE \
              | gzip -n > "dist/release/decant-${target}.tar.gz"
          done
          (cd dist/release && sha256sum decant-*.tar.gz | tee SHA256SUMS)

      # Default mode = SLSA build provenance. Raw binaries are attested too, so
      # a user can verify the extracted `decant` after unpacking a tarball, and
      # SHA256SUMS so the checksum file everything else verifies against is
      # itself provenance-covered.
      - name: Attest build provenance (tarballs, raw binaries, SHA256SUMS)
        id: attest
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            dist/release/decant-*.tar.gz
            dist/bin/*/decant
            dist/release/SHA256SUMS

      # Ship the Sigstore bundle actions/attest just wrote as a release asset:
      # anyone can then verify provenance offline (gh attestation verify
      # --bundle) without the GitHub API, and OpenSSF Scorecard's
      # Signed-Releases probe recognizes the .sigstore.json suffix.
      # Deliberately NOT listed in SHA256SUMS — SHA256SUMS is one of the
      # bundle's attested subjects, so covering the bundle there would be
      # circular; the Sigstore signature is its integrity. Staged into
      # dist/release so it rides the release-tarballs artifact into the
      # github-release job.
      - name: Stage attestation bundle as a release asset
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          [ -s "$BUNDLE_PATH" ] || { echo "::error::actions/attest reported no bundle at '${BUNDLE_PATH}'"; exit 1; }
          cp "$BUNDLE_PATH" "dist/release/decant-${VERSION}.sigstore.json"

      - name: Upload pre-signing hashes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: presign-sha256s
          path: presign-sha256s.txt
          if-no-files-found: error

      - name: Upload release tarballs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-tarballs
          path: dist/release/
          if-no-files-found: error

      - name: Upload signed binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-binaries
          path: dist/bin/
          if-no-files-found: error

  # Release GATE, not an observer: every publish job sits downstream of this one,
  # so a darwin binary that will not run — or that fails the Gatekeeper gate on a
  # Developer ID build — blocks all publishing
  # (docs/releasing.md#macos-signing-and-notarization).
  # Run both architectures: GitHub's standard macOS label is arm64, so an explicit
  # Intel runner is required to exercise the darwin-x64 artifact too.
  smoke-darwin:
    name: Smoke signed darwin binary (${{ matrix.target }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions: {}
    env:
      SIGNED: ${{ needs.build.outputs.signed }}
    steps:
      - name: Download release tarballs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-tarballs
          path: dist/release

      - name: Extract, run, and verify the darwin binary
        run: |
          set -euo pipefail
          mkdir -p smoke
          tar -xzf "dist/release/decant-${{ matrix.target }}.tar.gz" -C smoke
          ./smoke/decant --version
          # UNCONDITIONAL: an ad-hoc signature must still be structurally valid.
          codesign --verify --strict --verbose=2 smoke/decant

          # Only the Gatekeeper acceptance gate depends on the signing mode. An
          # ad-hoc build is expected to be rejected by spctl — report the
          # assessment and move on; a Developer ID build must pass, fail-closed.
          # Anything other than true/false means the build output wiring broke;
          # refuse to guess rather than silently skipping the gate forever.
          case "$SIGNED" in
            true|false) ;;
            *)
              echo "::error::build reported no signing mode (got '${SIGNED}') — cannot decide whether the Gatekeeper gate applies"
              exit 1
              ;;
          esac

          if [ "$SIGNED" != "true" ]; then
            echo "::warning::ad-hoc signed build — reporting the spctl assessment for information only (a Developer ID build must pass it)"
            spctl -a -t exec -vv smoke/decant 2>&1 || true
            exit 0
          fi

          if ! assessment="$(spctl -a -t exec -vv smoke/decant 2>&1)"; then
            printf '%s\n' "$assessment"
            echo "::error::spctl rejected the binary — Gatekeeper would block users"
            exit 1
          fi
          printf '%s\n' "$assessment"
          case "$assessment" in
            *"Notarized Developer ID"*) echo "spctl assessment: Notarized Developer ID" ;;
            *)
              echo "::error::expected a 'Notarized Developer ID' spctl assessment"
              exit 1
              ;;
          esac

  determinism:
    name: Determinism canary (non-blocking)
    # meta must be a DIRECT dep — the needs context is non-transitive; without it
    # needs.meta.outputs.version is empty and the rebuild diverges by construction.
    needs: [meta, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes; don't leave the token in .git/config.
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
          # No cache on the release path. A cache entry written by an earlier
          # PR run is attacker-influenced input, and this workflow signs and
          # publishes what it builds — a poisoned restore would ship.
          no-cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Rebuild all release targets
        run: bun run scripts/build-binaries.ts --target all --out-dir dist/bin --version "$VERSION"

      - name: Download pre-signing hashes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: presign-sha256s

      - name: Compare rebuild against pre-signing hashes (WARN only)
        run: |
          set -euo pipefail
          sha256sum dist/bin/*/decant | tee rebuild-sha256s.txt
          if diff -u presign-sha256s.txt rebuild-sha256s.txt; then
            echo "determinism canary: rebuild is byte-identical to the release build"
          else
            # Bun does not formally guarantee deterministic --compile output; measure,
            # don't promise. Promote to blocking once green for a few releases
            # (docs/releasing.md#determinism-canary).
            echo "::warning::determinism canary: rebuild diverged from the release build's pre-signing hashes (non-blocking)"
          fi

  npm:
    name: Publish npm packages
    # meta must be a DIRECT dep (the needs context is non-transitive); smoke-darwin
    # is a release GATE — nothing publishes if the signed darwin binary fails it.
    needs: [meta, build, smoke-darwin]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes; don't leave the token in .git/config.
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
          # No cache on the release path. A cache entry written by an earlier
          # PR run is attacker-influenced input, and this workflow signs and
          # publishes what it builds — a poisoned restore would ship.
          no-cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Staging must consume the binaries `build` signed — never rebuild here
      # (docs/releasing.md#macos-signing-and-notarization).
      - name: Download signed binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-binaries
          path: dist/bin

      - name: Stage npm packages from signed binaries
        run: bun run scripts/build-npm.ts --target all --binary-dir dist/bin --out-dir dist/npm --no-build --clean --version "$VERSION"

      # Every published package must carry the license texts (Apache-2.0 §4(d)) —
      # the four platform packages plus the launcher.
      - name: Assert LICENSE and NOTICE staged in all five packages
        run: |
          set -euo pipefail
          for dir in dist/npm/*/; do
            for file in LICENSE NOTICE; do
              if [ ! -f "${dir}${file}" ]; then
                echo "::error::${file} missing from staged package ${dir} (Apache-2.0 §4(d))"
                exit 1
              fi
            done
          done

      - name: Set up Node for npm publish
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # Node 24's bundled npm already clears the trusted-publishing floor. Do NOT
      # `npm install -g npm@latest` — an unpinned moving target at the most
      # supply-chain-sensitive step; assert the floor instead
      # (docs/releasing.md#npm-bootstrap-and-trusted-publishing).
      - name: Assert npm supports trusted publishing (>= 11.5.1)
        run: dpkg --compare-versions "$(npm --version)" ge 11.5.1 || exit 1

      # Prove the real optionalDependencies resolution path — the code path every
      # npx user hits — against the STAGED packages, before anything is
      # irrevocably published. No DECANT_BINARY_PATH override.
      #
      # The launcher (`@dosu/decant`, staged under dist/npm/decant — npm refuses
      # the unscoped name, see scripts/distribution.ts) runs here in its own
      # scratch project, which is how a real user installs it. This is its only
      # pre-publish execution — npm-smoke exercises it again after publishing,
      # but a launcher that cannot resolve its platform package is
      # unrecoverable once published, so it must prove itself before anything
      # ships.
      - name: Pack-and-install smoke on staged packages (pre-publish)
        run: |
          set -euo pipefail
          platform_tgz="$(cd dist/npm/decant-linux-x64 && npm pack --silent | tail -n1)"
          for launcher_dir in decant; do
            # Read the name from the staged manifest so the installed path can never
            # drift from what the launcher directory actually declares.
            launcher_pkg="$(node -p "JSON.parse(require('fs').readFileSync('dist/npm/${launcher_dir}/package.json','utf8')).name")"
            launcher_tgz="$(cd "dist/npm/${launcher_dir}" && npm pack --silent | tail -n1)"
            smoke_dir="$(mktemp -d)"
            ( cd "$smoke_dir"
              npm init -y >/dev/null
              # Scorecard's Pinned-Dependencies check flags every `npm install`
              # that is not `npm ci`, but these are the two tarballs this run
              # just built and packed — there is no registry fetch to hash-pin,
              # and `npm ci` cannot install local tarballs. The corresponding
              # code-scanning alert is dismissed as won't-fix.
              npm install --ignore-scripts --no-audit --no-fund \
                "$GITHUB_WORKSPACE/dist/npm/decant-linux-x64/$platform_tgz" \
                "$GITHUB_WORKSPACE/dist/npm/${launcher_dir}/$launcher_tgz"
              out="$(env -u DECANT_BINARY_PATH node "node_modules/${launcher_pkg}/bin/decant.cjs" --version)"
              echo "staged launcher ${launcher_pkg} reports: $out"
              [[ "$out" == *"$VERSION"* ]] || { echo "::error::staged launcher ${launcher_pkg} reported '$out', expected version $VERSION"; exit 1; }
            )
            rm -rf "$smoke_dir" "dist/npm/${launcher_dir}/${launcher_tgz}"
          done
          rm -f "dist/npm/decant-linux-x64/${platform_tgz}"

      # Dist-tag chosen at publish time: `npm dist-tag add` is not OIDC-capable, so
      # tagging after the fact would silently keep the bootstrap token alive past
      # its purpose (docs/releasing.md#npm-bootstrap-and-trusted-publishing).
      - name: Derive npm dist-tag channel
        run: |
          if [[ "${{ needs.meta.outputs.is_prerelease }}" == "true" ]]; then CHANNEL=next
          elif [[ "${{ needs.meta.outputs.is_latest }}" == "true" ]]; then CHANNEL=latest
          else CHANNEL=previous; fi   # a stable backport landing after a newer stable already shipped
          echo "CHANNEL=$CHANNEL" >> "$GITHUB_ENV"

      # OIDC trusted publishing: NO NODE_AUTH_TOKEN anywhere in this step — its
      # presence silently flips npm onto the legacy token path. The v0.1.0
      # bootstrap-token step that used to sit beside this one is gone: trusted
      # publishers now exist on all five packages
      # (docs/releasing.md#npm-bootstrap-and-trusted-publishing).
      #
      # Publish ORDER MATTERS: the four platform packages first, because the
      # launcher declares optionalDependencies on them, then `@dosu/decant`.
      # Package names come from each staged manifest — the launcher's directory
      # name (dist/npm/decant) is not its package name, and a hard-coded guess
      # would make the `npm view` idempotency check test a different package
      # than the one `npm publish` ships. Same channel on all five.
      - name: Publish packages (OIDC trusted publishing)
        run: |
          set -euo pipefail
          for dir in decant-darwin-arm64 decant-darwin-x64 decant-linux-arm64 decant-linux-x64 decant; do
            pkg="$(node -p "JSON.parse(require('fs').readFileSync('dist/npm/${dir}/package.json','utf8')).name")"
            if npm view "${pkg}@${VERSION}" version >/dev/null 2>&1; then
              echo "::notice::${pkg}@${VERSION} already published — skipping (idempotent re-run)"
              continue
            fi
            npm publish "dist/npm/${dir}" --access public --tag "$CHANNEL" --provenance
          done

  # Post-publish smoke: the exact code path every real `npx @dosu/decant` user hits —
  # the scoped launcher is the invocation the docs tell people to type —
  # including real optionalDependencies resolution off the live registry.
  npm-smoke:
    name: Post-publish npx smoke (${{ matrix.target }})
    needs: [meta, npm]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-15
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions: {}
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      # A package's FIRST publish takes materially longer to become resolvable
      # than a subsequent version of an existing package: v0.1.0-rc.2 exhausted a
      # 10x30s budget and was resolvable minutes later, with the same command
      # succeeding by hand. 20 attempts covers that without turning a genuine
      # publish failure into a 20-minute wait, because a real failure fails the
      # `npm` job upstream and this job never runs.
      - name: Run the launcher like an npx user (retry for registry propagation)
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            if npm exec --yes --prefer-online "@dosu/decant@${VERSION}" -- --version; then
              exit 0
            fi
            echo "attempt ${attempt}/20: @dosu/decant@${VERSION} not resolvable yet — waiting for registry propagation"
            sleep 30
          done
          echo "::error::@dosu/decant@${VERSION} never became runnable via npm exec after 10 minutes"
          exit 1

  github-release:
    name: GitHub Release
    # npm-smoke is a release GATE: the Latest release page — which
    # releases/latest/download/ and install.sh resolve — and the tap formula
    # behind it must not advance if the published launcher can't run.
    needs: [meta, build, npm, npm-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release and upload assets
    steps:
      # install.sh ships from the tag's tree as a release asset.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes; don't leave the token in .git/config.
          persist-credentials: false

      - name: Download release tarballs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-tarballs
          path: dist/release

      - name: Stage install.sh next to the tarballs
        run: cp install.sh dist/release/install.sh

      # gh release create is NOT idempotent (422 already_exists; --verify-tag only
      # guards a missing tag) — view first, create on a miss, refresh assets on a hit.
      - name: Publish or refresh the GitHub Release
        working-directory: dist/release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.meta.outputs.version }}
          PRERELEASE: ${{ needs.meta.outputs.is_prerelease }}
          IS_LATEST: ${{ needs.meta.outputs.is_latest }}
        run: |
          set -euo pipefail
          # The attestation bundle is a named asset on every release; a missing
          # bundle means the build job's staging step silently changed — fail
          # closed rather than publish a release without it.
          bundle="decant-${TAG#v}.sigstore.json"
          [ -f "$bundle" ] || { echo "::error::attestation bundle ${bundle} missing from the release-tarballs artifact"; exit 1; }
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::$TAG already has a release — refreshing assets only (gh release create would 422)"
            gh release upload "$TAG" ./*.tar.gz "$bundle" SHA256SUMS install.sh --clobber
          else
            flags=(--verify-tag --generate-notes)
            [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
            [ "$IS_LATEST" = "true" ] || flags+=(--latest=false)  # GitHub marks the newest-created
              # release "Latest" by default — a backport would hijack releases/latest/download/
            gh release create "$TAG" ./*.tar.gz "$bundle" SHA256SUMS install.sh "${flags[@]}"
          fi

  docker:
    name: Publish Docker image
    # verify is enforced transitively via build; gating on build + smoke-darwin keeps
    # the release atomic — no GHCR push for a version whose signing or darwin smoke
    # failed.
    needs: [meta, build, smoke-darwin]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # Sigstore signing for actions/attest
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes; don't leave the token in .git/config.
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Hand-rolled tag list on purpose: docker/metadata-action's latest=auto cannot
      # compare across tags and would re-tag :latest on a backport — meta owns that
      # decision (docs/releasing.md#tag-guard-and-prerelease-detection).
      - name: Compute tag list
        id: tags
        env:
          IS_LATEST: ${{ needs.meta.outputs.is_latest }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          { echo "list<<TAGS_EOF"
            echo "ghcr.io/dosu-ai/decant:${VERSION}"
            [[ "$IS_LATEST" == "true" ]] && echo "ghcr.io/dosu-ai/decant:latest"
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          build-args: |
            DECANT_VERSION=${{ needs.meta.outputs.version }}
          provenance: mode=max
          sbom: true

      # Second producer on purpose: buildx provenance and GitHub attestations have
      # different verifiers.
      - name: Attest image provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ghcr.io/dosu-ai/decant # fully-qualified, no tag
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # A GHCR package created under an org is PRIVATE on first push, even when
      # the repository is public: the push succeeds and an anonymous
      # `docker pull` then 401s. There is NO API to change package visibility --
      # it is web UI only (cli/cli#6820, open since 2023). So this step cannot
      # fix it; it detects it and says so loudly, rather than leaving a release
      # that looks green while `docker pull` fails for everyone.
      - name: Check the image is anonymously pullable
        continue-on-error: true
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          code="$(curl -s -o /dev/null -w '%{http_code}' \
            "https://ghcr.io/v2/dosu-ai/decant/manifests/${VERSION}")"
          if [ "$code" = "200" ]; then
            echo "anonymous pull works (HTTP 200) — package is public"
            exit 0
          fi
          echo "::warning::ghcr.io/dosu-ai/decant:${VERSION} is not anonymously pullable (HTTP ${code}). A GHCR package is private on first push and there is no API to change it. Set it to public once, by hand: https://github.com/orgs/dosu-ai/packages/container/decant/settings -> Danger Zone -> Change visibility. This is a one-time action; later releases inherit it."

  # Render the exact formula that will be tested and pushed. Stable AND is_latest
  # only: a prerelease must not seed the tap and a backport must not downgrade it.
  homebrew-formula:
    name: Render Homebrew formula
    needs: [meta, build, github-release]
    if: needs.meta.outputs.is_prerelease == 'false' && needs.meta.outputs.is_latest == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes; don't leave the token in .git/config.
          persist-credentials: false

      - name: Download release tarballs (for SHA256SUMS)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-tarballs
          path: dist/release

      - name: Render decant.rb from the in-repo template
        run: |
          set -euo pipefail
          sha_for() {
            awk -v file="decant-$1.tar.gz" '$2 == file { print $1 }' dist/release/SHA256SUMS
          }
          darwin_arm64="$(sha_for darwin-arm64)"
          darwin_x64="$(sha_for darwin-x64)"
          linux_arm64="$(sha_for linux-arm64)"
          linux_x64="$(sha_for linux-x64)"
          for value in "$darwin_arm64" "$darwin_x64" "$linux_arm64" "$linux_x64"; do
            if ! [[ "$value" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::missing or malformed sha256 in SHA256SUMS"
              exit 1
            fi
          done
          mkdir -p dist/homebrew
          # '/^##/d' strips the template's own doc header from the rendered formula.
          sed -e '/^##/d' \
            -e "s/__VERSION__/${VERSION}/g" \
            -e "s/__SHA256_DARWIN_ARM64__/${darwin_arm64}/g" \
            -e "s/__SHA256_DARWIN_X64__/${darwin_x64}/g" \
            -e "s/__SHA256_LINUX_ARM64__/${linux_arm64}/g" \
            -e "s/__SHA256_LINUX_X64__/${linux_x64}/g" \
            packaging/homebrew/decant.rb.template > dist/homebrew/decant.rb

      - name: Upload rendered formula
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homebrew-formula
          path: dist/homebrew/decant.rb
          if-no-files-found: error

  # Test the rendered formula on every supported OS/architecture before the tap
  # moves. This consumes live GitHub Release assets, so it validates the user path
  # rather than only linting Ruby syntax.
  homebrew-smoke:
    name: Homebrew install smoke (${{ matrix.target }})
    needs: [meta, homebrew-formula]
    if: needs.meta.outputs.is_prerelease == 'false' && needs.meta.outputs.is_latest == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Homebrew supports Linux on x86_64 only, so there is no linux-arm64
          # leg. The formula still declares that URL for anyone whose brew works
          # there, but tap-update needs this job — gating the tap push on a
          # platform Homebrew does not support would block it on the very
          # release that introduces the tap. linux-arm64 is covered by
          # install.sh, npm, and the Docker image.
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-15
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@df4b09108a1de9d6f995fe68f302b3f68bd6d2ef # main @ 2026-07-17

      - name: Download rendered formula
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: homebrew-formula
          path: Formula

      - name: Audit, install, and test
        run: |
          set -euo pipefail
          brew tap dosu-ai/dosu
          tap_root="$(brew --repository dosu-ai/dosu)"
          cp Formula/decant.rb "${tap_root}/Formula/decant.rb"
          brew audit --strict --online --formula dosu-ai/dosu/decant
          brew install --formula dosu-ai/dosu/decant
          brew test dosu-ai/dosu/decant
          out="$(decant --version)"
          echo "Homebrew decant reports: $out"
          [[ "$out" == *"$VERSION"* ]] \
            || { echo "::error::Homebrew decant reported '$out', expected version $VERSION"; exit 1; }

  # The tap is a first-class install channel, so a stale formula is a
  # user-visible regression. Push only the formula artifact that passed the
  # four-platform Homebrew smoke matrix above.
  tap-update:
    name: Update Homebrew tap
    needs: [meta, github-release, homebrew-formula, homebrew-smoke]
    if: needs.meta.outputs.is_prerelease == 'false' && needs.meta.outputs.is_latest == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # the tap push authenticates via HOMEBREW_TOKEN
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      # zizmor: ignore[artipacked] — this job's whole purpose is pushing the
      # rendered formula to the tap, so the credential has to persist. It
      # uploads no artifacts.
      - name: Check out dosu-ai/homebrew-dosu # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dosu-ai/homebrew-dosu
          token: ${{ secrets.HOMEBREW_TOKEN }}
          path: homebrew-dosu

      - name: Download tested formula
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: homebrew-formula
          path: homebrew-dosu/Formula

      - name: Commit and push
        working-directory: homebrew-dosu
        run: |
          set -euo pipefail
          git add Formula/decant.rb
          if git diff --cached --quiet; then
            echo "::notice::Formula/decant.rb already matches v${VERSION} — nothing to push"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update decant to v${VERSION}"
          git push
